name: release

# Checks a vX.Y.Z tag (typecheck, tests, committed build, version) and, when
# an NPM_TOKEN secret is set, publishes @doon/ui to npm. Consumers install from
# the git tag, so without the secret the tag is checked and nothing is
# published.
#
#   npm version patch   # or minor / major - writes package.json and tags
#   git push --follow-tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # dist/ is committed so git-URL consumers keep working. If a rebuild
      # differs from what was committed, the tag is stale - fail rather than
      # publish something nobody reviewed.
      - name: dist/ matches the committed build
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date. Run 'npm run build' and commit before tagging."
            git diff --stat -- dist
            exit 1
          fi

      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ($pkg)"
            exit 1
          fi

      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish
